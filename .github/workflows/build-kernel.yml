name: Build and Release Kernel

on:
  schedule:
    # Check for new Arch Linux kernel releases daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force compilation and release even if this version already exists'
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - 'PKGBUILD'
      - 'config.x86_64'
      - 'hp-modules.list'

permissions:
  contents: write

jobs:
  check-and-build:
    name: Check Updates, Compile and Release
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged

    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel \
            git \
            bc \
            pahole \
            python \
            zstd \
            tar \
            xz \
            curl \
            github-cli \
            sudo

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure safe git directory
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check upstream Arch Linux kernel and determine release tag
        id: check_version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_BUILD: ${{ inputs.force_build }}
        run: |
          git fetch https://gitlab.archlinux.org/archlinux/packaging/packages/linux.git main || true
          UPSTREAM_HASH=$(git rev-parse FETCH_HEAD 2>/dev/null || echo "")
          
          CURRENT_VER=$(grep -E '^pkgver=' PKGBUILD | cut -d= -f2)
          CURRENT_REL=$(grep -E '^pkgrel=' PKGBUILD | cut -d= -f2)
          
          if [ -n "$UPSTREAM_HASH" ]; then
            UPSTREAM_VER=$(git show "$UPSTREAM_HASH:PKGBUILD" 2>/dev/null | grep -E '^pkgver=' | cut -d= -f2 || echo "$CURRENT_VER")
            UPSTREAM_REL=$(git show "$UPSTREAM_HASH:PKGBUILD" 2>/dev/null | grep -E '^pkgrel=' | cut -d= -f2 || echo "$CURRENT_REL")
          else
            UPSTREAM_VER="$CURRENT_VER"
            UPSTREAM_REL="$CURRENT_REL"
          fi
          
          TARGET_TAG="v${UPSTREAM_VER}-${UPSTREAM_REL}"
          echo "target_tag=$TARGET_TAG" >> "$GITHUB_OUTPUT"
          echo "upstream_ver=$UPSTREAM_VER" >> "$GITHUB_OUTPUT"
          echo "upstream_rel=$UPSTREAM_REL" >> "$GITHUB_OUTPUT"
          echo "upstream_hash=$UPSTREAM_HASH" >> "$GITHUB_OUTPUT"

          if gh release view "$TARGET_TAG" &>/dev/null && [ "$FORCE_BUILD" != "true" ]; then
            echo "Release $TARGET_TAG already exists and force_build is not set. Skipping build."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Release $TARGET_TAG does not exist or force_build is true. Proceeding with build."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update sources and apply optimizations
        if: steps.check_version.outputs.should_build == 'true'
        run: |
          UPSTREAM_HASH="${{ steps.check_version.outputs.upstream_hash }}"
          CURRENT_VER=$(grep -E '^pkgver=' PKGBUILD | cut -d= -f2)
          UPSTREAM_VER="${{ steps.check_version.outputs.upstream_ver }}"
          
          if [ -n "$UPSTREAM_HASH" ] && [ "$CURRENT_VER" != "$UPSTREAM_VER" ]; then
            echo "Updating PKGBUILD and config.x86_64 to upstream $UPSTREAM_VER..."
            git checkout "$UPSTREAM_HASH" -- PKGBUILD config.x86_64
          fi

          # Apply HP Laptop & Alder Lake optimizations
          python3 apply-optimizations.py

          # Commit updated PKGBUILD & config back to repository if changed
          if ! git diff --quiet PKGBUILD config.x86_64; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add PKGBUILD config.x86_64
            git commit -m "chore(kernel): update to upstream ${{ steps.check_version.outputs.upstream_ver }} [skip ci]" || true
            git push origin main || true
          fi

      - name: Build custom kernel package
        if: steps.check_version.outputs.should_build == 'true'
        run: |
          useradd -m -s /bin/bash builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder "$GITHUB_WORKSPACE"

          su builder -c "CI=true MAKEFLAGS='-j$(nproc)' makepkg -s --noconfirm --force"

      - name: Generate Checksums & Release Notes
        if: steps.check_version.outputs.should_build == 'true'
        run: |
          TARGET_TAG="${{ steps.check_version.outputs.target_tag }}"
          UPSTREAM_VER="${{ steps.check_version.outputs.upstream_ver }}"

          sha256sum linux-hp-*.pkg.tar.zst > sha256sums.txt
          sed "s/{{TARGET_TAG}}/${TARGET_TAG}/g; s/{{UPSTREAM_VER}}/${UPSTREAM_VER}/g" release-template.md > release_notes.md

      - name: Publish GitHub Release
        if: steps.check_version.outputs.should_build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARGET_TAG="${{ steps.check_version.outputs.target_tag }}"

          if gh release view "$TARGET_TAG" &>/dev/null; then
            gh release delete "$TARGET_TAG" --yes --cleanup-tag || true
          fi

          gh release create "$TARGET_TAG" \
            linux-hp-*.pkg.tar.zst sha256sums.txt \
            --title "linux-hp ${TARGET_TAG}" \
            --notes-file release_notes.md \
            --latest
